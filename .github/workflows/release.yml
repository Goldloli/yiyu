name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/version.mjs
      - run: pnpm tauri build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: yiyu-macos
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/version.mjs
      - run: pnpm tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: yiyu-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Validate release asset names
        run: node scripts/validate-release-assets.mjs release-assets
      - name: Validate asset matrix
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -name '*_aarch64.dmg' | wc -l | tr -d ' ')" = "1"
          test "$(find release-assets -maxdepth 1 \( -name '*_x64-setup.exe' -o -name '*_x64.exe' \) | wc -l | tr -d ' ')" = "1"
      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes" ]]; then
            notes=".github/release-notes/v0.1.0.md"
          fi
          cp "$notes" release-body.md
      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: sha256sum -- *.dmg *.exe > SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/SHA256SUMS.txt
          body_path: release-body.md
          fail_on_unmatched_files: true

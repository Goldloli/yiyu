name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/version.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web
      - run: node scripts/measure-first-load.mjs web/dist
      - name: OpenSpec
        run: |
          npm install --global @fission-ai/openspec@1.17.0
          openspec validate --all --strict

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  browser:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm qa:interactions
      - run: pnpm qa:screenshots
      - run: pnpm qa:screenshots:compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: web/qa/artifacts/
          if-no-files-found: warn

  manual-platform-evidence:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "CI only covers compilation, unit tests and frontend browser evidence."
          echo "macOS/Windows permission, selection capture, focus, proxy and installer checks remain manual QA gates."
